version: 3

images:
  base_image:
    name: 'registry.redhat.io/ansible-automation-platform-25/ee-supported-rhel9:latest'

dependencies:
  ansible_core:
    package_pip: ansible-core==2.15.13
  ansible_runner:
    package_pip: ansible-runner==2.4.0
  galaxy:
    collections:
      - community.general
      - community.postgresql
  python:
    # ระบุเวอร์ชันหลักให้ชัดเจนเพื่อลดความซ้ำซ้อน
    - python3.9
    - python3-pip
  system:
    - gcc
    - systemd-devel
    - python3.11-devel
    - libxml2-devel
    - python3-devel
    - libpq-devel
    - acl # เพิ่มสำหรับจัดการ permissions

additional_build_steps:
  append_base:
    - RUN microdnf install -y python39 python3-pip
  append_final:
    # 1. จัดการสิทธิ์โฟลเดอร์ /runner ให้ User สุ่ม (GID 0) สามารถเขียน/รันได้
    - RUN chgrp -R 0 /runner && chmod -R g=u /runner
    # 2. ตั้งค่าให้ไฟล์ใน /runner/inventory สามารถ execute ได้ (เผื่อกรณี script inventory)
    - RUN chmod -R +x /runner/inventory || true
    # 3. ตรวจสอบและสร้าง symlink สำหรับ python ให้ชัวร์ว่าเรียกใช้งานได้ถูกตัว
    - RUN ln -sf /usr/bin/python3.9 /usr/bin/python3

options:
  package_manager_path: /usr/bin/microdnf